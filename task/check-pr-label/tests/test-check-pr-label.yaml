apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-check-pr-label
spec:
  workspaces:
    - name: tests-workspace
      description: The workspace provided by the test runner script (unused by this test).
  tasks:
    - name: regression-tests
      taskSpec:
        volumes:
          - name: regression
            configMap:
              name: check-pr-label-regression
        steps:
          - name: run
            image: registry.access.redhat.com/ubi9/python-311:latest
            env:
              - name: CHECK_PR_LABEL_SCRIPT
                value: /mnt/regression/check-pr-label.py
            volumeMounts:
              - name: regression
                mountPath: /mnt/regression
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              python3 -m unittest discover -s /mnt/regression -p test_check_pr_label.py -v

    # The Secret is deliberately absent. Both Tasks must fail before
    # contacting an API; continue here only to verify these expected failures.
    - name: check-github-without-token
      onError: continue
      taskRef:
        name: check-pr-label
      params:
        - name: git-url
          value: https://github.com/test/repo
        - name: git-revision
          value: deadbeef
        - name: target-label
          value: evaluate
        - name: git-token-secret-name
          value: check-pr-label-no-token-fixture

    - name: check-gitlab-without-token
      onError: continue
      taskRef:
        name: check-pr-label
      params:
        - name: git-url
          value: https://gitlab.example.com/test/repo
        - name: git-revision
          value: deadbeef
        - name: target-label
          value: evaluate
        - name: git-token-secret-name
          value: check-pr-label-no-token-fixture

  finally:
    - name: verify-results
      params:
        - name: github-status
          value: $(tasks.check-github-without-token.status)
        - name: gitlab-status
          value: $(tasks.check-gitlab-without-token.status)
      taskSpec:
        params:
          - name: github-status
            type: string
          - name: gitlab-status
            type: string
        steps:
          - name: verify
            image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
            env:
              - name: GITHUB_STATUS
                value: $(params.github-status)
              - name: GITLAB_STATUS
                value: $(params.gitlab-status)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              test "$GITHUB_STATUS" = Failed
              test "$GITLAB_STATUS" = Failed
              echo "Both platforms fail when the token is absent"
