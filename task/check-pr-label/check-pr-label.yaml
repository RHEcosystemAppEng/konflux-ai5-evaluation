# to use this Task version and pin its published bundle digest. Pass git-url,
# git-revision, target-label=evaluate, and pr-status-is=merged; use the has-label
# result and retain the existing Git token Secret.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-pr-label
  labels:
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    Checks whether a target PR label is present on a specific pull/merge request
    or one associated with a given git commit. Supports both GitHub and GitLab.
    Derives the API endpoint from the git-url host. Returns "true" if the
    label and optional status match, "false" otherwise. Fails if no request
    can be selected or the check cannot be completed.
  params:
    - name: git-url
      type: string
      description: Git repository URL (e.g. https://github.com/owner/repo)
    - name: git-revision
      type: string
      default: ""
      description: Git commit SHA to look up associated PRs/MRs for
    - name: pr-number
      type: string
      default: ""
      description: Optional repository-scoped PR number or GitLab MR IID; overrides CONTEXT_PR_NUMBER and commit lookup
    - name: target-label
      type: string
      description: PR/MR label name to check for
    - name: pr-status-is
      type: string
      default: ""
      description: Optional PR/MR status (open, merged, closed); empty means any status
    - name: git-token-secret-name
      type: string
      default: "git-secret"
      description: Name of the Secret containing the Git access token
    - name: git-token-secret-key
      type: string
      default: "password"
      description: Key within the Git token Secret
  results:
    - name: has-label
      description: "'true' if target-label appears on the PR/MR, 'false' otherwise"
  steps:
    - name: check
      image: registry.access.redhat.com/ubi9/python-311:latest
      env:
        - name: GIT_URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: PR_NUMBER
          value: $(params.pr-number)
        - name: TARGET_LABEL
          value: $(params.target-label)
        - name: PR_STATUS
          value: $(params.pr-status-is)
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.git-token-secret-name)
              key: $(params.git-token-secret-key)
              optional: true
        - name: RESULT_PATH
          value: $(results.has-label.path)
      script: |
        #!/usr/bin/env python3
        from datetime import datetime
        import json
        import os
        from pathlib import Path
        import re
        import ssl
        import sys
        import urllib.parse
        import urllib.request

        status = os.environ["PR_STATUS"]
        if status not in ("", "open", "merged", "closed"):
            sys.exit(f"ERROR: Invalid PR status: {status}")

        token = os.environ.get("GIT_TOKEN", "")
        label = os.environ["TARGET_LABEL"]
        if not token:
            sys.exit("ERROR: GIT_TOKEN is required to check PR/MR labels")
        else:
            repository = urllib.parse.urlsplit(os.environ["GIT_URL"])
            host = (repository.hostname or "").lower()
            path = repository.path.rstrip("/").lstrip("/").removesuffix(".git")
            revision = os.environ["REVISION"]
            pr_number = os.environ.get("PR_NUMBER", "") or os.environ.get("CONTEXT_PR_NUMBER", "")
            if "github" in host:
                platform = "github"
                api = "https://api.github.com" if host == "github.com" else f"{repository.scheme}://{repository.netloc}/api/v3"
                url = f"{api}/repos/{path}/commits/{revision}/pulls"
                if pr_number:
                    url = f"{api}/repos/{path}/pulls/{pr_number}"
                headers = {"Accept": "application/vnd.github+json", "Authorization": f"token {token}"}
            elif "gitlab" in host:
                platform = "gitlab"
                project = urllib.parse.quote(path, safe="")
                url = f"{repository.scheme}://{repository.netloc}/api/v4/projects/{project}/repository/commits/{revision}/merge_requests"
                if pr_number:
                    url = f"{repository.scheme}://{repository.netloc}/api/v4/projects/{project}/merge_requests/{pr_number}"
                headers = {"PRIVATE-TOKEN": token}
            else:
                sys.exit(f"ERROR: Unsupported Git platform: {host}")

            try:
                # Preserve the existing tasks' handling of internal Git certificates.
                context = ssl._create_unverified_context()
                requests = []
                next_url = url
                while next_url:
                    request = urllib.request.Request(next_url, headers=headers)
                    with urllib.request.urlopen(request, context=context, timeout=30) as response:
                        page = json.loads(response.read())
                        next_page = re.search(r'<([^>]+)>;\s*rel="next"', response.headers.get("Link", ""))
                    if pr_number:
                        requests = [page]
                        break
                    if not isinstance(page, list):
                        raise ValueError("Expected a list of PR/MR objects from commit lookup")
                    requests.extend(page)
                    next_url = next_page.group(1) if next_page else None
                    if next_url and urllib.parse.urlsplit(next_url)[:2] != urllib.parse.urlsplit(url)[:2]:
                        raise ValueError("Unexpected pagination host or scheme")
                if not requests:
                    raise ValueError("No PRs/MRs found for the commit; this Task requires an associated PR/MR")
                if len(requests) > 1:
                    item = max(requests, key=lambda item: datetime.fromisoformat(item["created_at"]))
                    number = item["number" if platform == "github" else "iid"]
                    print(f"WARNING: Found {len(requests)} PRs/MRs without a PR number; checking only the latest PR/MR {number}", file=sys.stderr)
                else:
                    item = requests[0]
                labels, state = item["labels"], item["state"]
                valid_states = ("open", "closed") if platform == "github" else ("opened", "closed", "merged", "locked")
                if not isinstance(labels, list) or state not in valid_states:
                    raise ValueError("Invalid label or status data on the selected PR/MR")
                if platform == "github":
                    labels = [entry["name"] for entry in labels]
                    if item["merged_at"] is not None:
                        datetime.fromisoformat(item["merged_at"])
                        state = "merged"
                else:
                    state = "open" if state == "opened" else state
                if any(not isinstance(name, str) for name in labels):
                    raise ValueError("Invalid label data on the selected PR/MR")
                result = label in labels and (not status or state == status)
            except Exception as error:
                sys.exit(f"ERROR: PR/MR lookup failed: {error}")

        value = "true" if result else "false"
        Path(os.environ["RESULT_PATH"]).write_text(value)
        print(f"has-label: {value}")
