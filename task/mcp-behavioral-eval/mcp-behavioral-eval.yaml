apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-behavioral-eval
  labels:
    app.kubernetes.io/version: "0.1.0"
spec:
  description: >-
    Behavioral evaluation of an MCP server using mcpchecker.
    Runs mcpchecker as a Kubernetes Job on the target cluster so it
    can reach the deployed MCP service directly. The generic default
    task suite tests tool correctness, edge-case handling, and
    sensitive data redaction — applicable to any MCP server.
    Suite files and aggregation code are baked into the mcp-eval image.
  params:
    - name: namespace-name
      type: string
      description: Ephemeral namespace where the MCP server is deployed
    - name: service-name
      type: string
      default: "mcp-server"
      description: Kubernetes Service name of the deployed MCP server
    - name: service-port
      type: string
      default: "8080"
      description: Port on which the MCP server listens
    - name: job-timeout
      type: string
      default: "1800"
      description: Timeout in seconds for the mcpchecker Job
    - name: llm-agent-secret
      type: string
      default: "mcp-eval-llm-agent"
      description: >-
        Name of the Secret on the target cluster (in the default namespace)
        containing LLM credentials. Keys: openai-api-key, openai-base-url,
        anthropic-api-key, anthropic-base-url (fill only the active
        provider), and model-name (e.g. "openai:gpt-4o"). Copied into
        the ephemeral namespace.
    - name: llm-judge-secret
      type: string
      default: "mcp-eval-llm-judge"
      description: >-
        Name of the Secret on the target cluster (in the default namespace)
        containing the judge LLM model name. Only the model key is used;
        credentials come from the agent secret (mcpchecker shares provider
        env vars between agent and judge).
    - name: llm-ca-secret
      type: string
      default: "mcp-eval-ca"
      description: >-
        Name of the Secret on the target cluster (in the default namespace)
        containing the CA certificate bundle for internal LLM endpoints.
        Key: ca.crt. Mounted into the mcpchecker container trust store.
        Optional — if the secret does not exist, TLS uses default system CAs.
    - name: mcp-eval-image
      type: string
      default: "quay.io/ecosystem-appeng/konflux-skill-evaluation/abevalflow-mcp-eval:0.1"
      description: >-
        MCP eval image with mcpchecker binary, task suite files, and
        aggregation scripts baked in.
    - name: mcp-path
      type: string
      default: "/mcp"
      description: >-
        URL path suffix appended to the service endpoint for the MCP
        Streamable HTTP transport. The MCP spec mandates /mcp but some
        servers may mount the endpoint at a different path.
    - name: job-template
      type: string
      default: "templates/mcp-behavioral-eval-job.yaml"
      description: >-
        Relative path to the Kubernetes Job template (from task directory).
        Override with an absolute path if needed.
    - name: suites-dir
      type: string
      default: "suites/default"
      description: >-
        Relative path to the mcpchecker task suites directory (from task directory).
    - name: secrets-namespace
      type: string
      default: "default"
      description: >-
        Namespace on the target cluster where LLM secrets (agent, judge,
        CA) are stored. Defaults to the default namespace.
    - name: pipeline-run-id
      type: string
      description: Pipeline run ID for provenance tracking
    - name: submission-name
      type: string
      description: Name of the MCP component being evaluated (from the Konflux snapshot)
  workspaces:
    - name: source
      description: Shared workspace for storing results
    - name: target-kubeconfig
      description: >-
        Kubeconfig for the target cluster. Must contain a file named
        "kubeconfig".
  results:
    - name: report-path
      description: Workspace-relative path to the MCP behavioral evaluation reports directory.
  steps:
    # ── Step 1: Copy LLM secrets to ephemeral namespace ──
    - name: setup
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: KUBECONFIG
          value: $(workspaces.target-kubeconfig.path)/kubeconfig
        - name: NAMESPACE
          value: $(params.namespace-name)
        - name: LLM_AGENT_SECRET
          value: $(params.llm-agent-secret)
        - name: LLM_JUDGE_SECRET
          value: $(params.llm-judge-secret)
        - name: LLM_CA_SECRET
          value: $(params.llm-ca-secret)
        - name: SECRETS_NAMESPACE
          value: $(params.secrets-namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        for SECRET_NAME in "$LLM_AGENT_SECRET" "$LLM_JUDGE_SECRET" "$LLM_CA_SECRET"; do
          if [ -n "$SECRET_NAME" ]; then
            # Check if secret already exists in ephemeral namespace
            if oc get secret "$SECRET_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
              echo "Secret '$SECRET_NAME' already present in $NAMESPACE"
              continue
            fi

            # Copy secret from secrets namespace
            if oc get secret "$SECRET_NAME" -n "$SECRETS_NAMESPACE" -o yaml \
              | sed '/^\s*namespace:/d; /^\s*uid:/d; /^\s*resourceVersion:/d; /^\s*creationTimestamp:/d' \
              | oc apply -n "$NAMESPACE" -f - 2>/dev/null; then
              echo "Copied secret '$SECRET_NAME' from $SECRETS_NAMESPACE into $NAMESPACE"
            else
              echo "WARNING: Could not copy secret '$SECRET_NAME' from $SECRETS_NAMESPACE namespace"
            fi
          fi
        done

    # ── Step 2: Prepare Job manifest from template ──
    - name: prepare-job
      image: $(params.mcp-eval-image)
      imagePullPolicy: Always
      env:
        - name: TASK_NAME
          value: $(context.task.name)
        - name: NAMESPACE
          value: $(params.namespace-name)
        - name: JOB_NAME
          value: mcpchecker-eval
        - name: IMAGE
          value: $(params.mcp-eval-image)
        - name: JOB_TIMEOUT
          value: $(params.job-timeout)
        - name: MCP_URL
          value: http://$(params.service-name):$(params.service-port)$(params.mcp-path)
        - name: AGENT_SECRET
          value: $(params.llm-agent-secret)
        - name: JUDGE_SECRET
          value: $(params.llm-judge-secret)
        - name: CA_SECRET
          value: $(params.llm-ca-secret)
        - name: JOB_TEMPLATE
          value: $(params.job-template)
        - name: SUITES_DIR_PARAM
          value: $(params.suites-dir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Derive Python module name from task name
        TASK_MODULE="${TASK_NAME//-/_}"

        # Export suite directory path for template substitution
        export SUITES_DIR="/opt/${TASK_MODULE}/${SUITES_DIR_PARAM}"

        # shellcheck disable=SC2016  # envsubst variable spec is intentionally single-quoted
        envsubst \
          '${JOB_NAME} ${NAMESPACE} ${JOB_TIMEOUT} ${IMAGE} ${MCP_URL} ${AGENT_SECRET} ${JUDGE_SECRET} ${CA_SECRET} ${SUITES_DIR}' \
          < "/opt/${TASK_MODULE}/${JOB_TEMPLATE}" \
          > "$(workspaces.source.path)/mcp-behavioral-eval-job.yaml"

        echo "Generated Job manifest:"
        cat "$(workspaces.source.path)/mcp-behavioral-eval-job.yaml"

    # ── Step 3: Apply Job and collect results ──
    - name: run-mcpchecker-job
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: KUBECONFIG
          value: $(workspaces.target-kubeconfig.path)/kubeconfig
        - name: NAMESPACE
          value: $(params.namespace-name)
        - name: JOB_NAME
          value: mcpchecker-eval
        - name: JOB_TIMEOUT
          value: $(params.job-timeout)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Apply the Job
        oc apply -f "$(workspaces.source.path)/mcp-behavioral-eval-job.yaml" --namespace="$NAMESPACE"

        # Wait for Job completion
        TIMEOUT=$JOB_TIMEOUT
        DEADLINE=$((SECONDS + TIMEOUT))

        while true; do
          STATUS=$(oc get job "$JOB_NAME" -n "$NAMESPACE" \
            -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
          FAILED=$(oc get job "$JOB_NAME" -n "$NAMESPACE" \
            -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)

          if [ "$STATUS" = "True" ]; then
            echo "Job completed"
            break
          fi
          if [ "$FAILED" = "True" ]; then
            echo "WARNING: Job failed, collecting logs"
            break
          fi
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "ERROR: Job timed out after ${TIMEOUT}s"
            break
          fi
          sleep 10
        done

        # Collect Job output
        RESULTS_DIR="$(workspaces.source.path)/results"
        mkdir -p "$RESULTS_DIR"

        RAW_LOGS="$RESULTS_DIR/$JOB_NAME-logs.txt"
        oc logs "job/$JOB_NAME" -n "$NAMESPACE" > "$RAW_LOGS" 2>&1 || {
          echo '{"error": "Failed to collect mcpchecker logs", "results": []}' > "$RAW_LOGS"
        }
        echo "=== mcpchecker Job logs ==="
        cat "$RAW_LOGS"
        echo "=== End of mcpchecker Job logs ==="

        OUTPUT="$RESULTS_DIR/$JOB_NAME-output.json"
        if grep -n '^{' "$RAW_LOGS" > /dev/null 2>&1; then
          START_LINE=$(grep -n '^{' "$RAW_LOGS" | head -1 | cut -d: -f1)
          tail -n +"$START_LINE" "$RAW_LOGS" > "$OUTPUT"
        else
          echo "ERROR: No JSON found in mcpchecker output"
          exit 1
        fi

        if ! python3 -c "import json; json.load(open('$OUTPUT'))" 2>/dev/null; then
          echo "ERROR: Invalid JSON from mcpchecker"
          exit 1
        fi

    # ── Step 4: Aggregate results and write Tekton results ──
    - name: aggregate-results
      image: $(params.mcp-eval-image)
      imagePullPolicy: Always
      env:
        - name: JOB_NAME
          value: mcpchecker-eval
        - name: SUBMISSION_NAME
          value: $(params.submission-name)
        - name: PIPELINE_RUN_ID
          value: $(params.pipeline-run-id)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        RESULTS_DIR="$(workspaces.source.path)/results"
        REPORTS_DIR="$(workspaces.source.path)/reports"
        OUTPUT_FILE="$RESULTS_DIR/$JOB_NAME-output.json"
        REPORT_REL="reports/behavioral-eval-summary.json"

        if [ ! -f "$OUTPUT_FILE" ]; then
          echo "ERROR: Output file not found: $OUTPUT_FILE"
          exit 1
        fi

        HAS_ERROR=$(python3 -c "
        import json
        d = json.load(open('$OUTPUT_FILE'))
        print('yes' if d.get('error') and not d.get('results') and not d.get('taskResults') else 'no')
        " 2>/dev/null || echo "yes")

        if [ "$HAS_ERROR" = "yes" ]; then
          echo "ERROR: mcpchecker output contains errors or no results"
          exit 1
        fi

        mkdir -p "$RESULTS_DIR" "$REPORTS_DIR"

        python3 -m scripts.aggregate_mcpchecker \
          --output-json "$OUTPUT_FILE" \
          --submission-name "$SUBMISSION_NAME" \
          --report-dir "$RESULTS_DIR" \
          --pipeline-run-id "$PIPELINE_RUN_ID" \
          > /tmp/aggregate_output.json 2>/tmp/aggregate_stderr.log || {
            echo '{"overall_score": 0, "passed_tasks": 0, "total_tasks": 0, "recommendation": "error"}' \
              > /tmp/aggregate_output.json
          }

        # Generate unified behavioral-eval-summary.json directly in reports/
        python3 -m scripts.behavioral_eval_summary \
          --results-dir "$RESULTS_DIR" \
          --report-dir "$REPORTS_DIR" || {
          echo "ERROR: Failed to generate behavioral-eval-summary.json"
          exit 1
        }

        echo -n "$REPORT_REL" > "$(results.report-path.path)"
        echo "MCP behavioral evaluation complete. Report available at: $REPORT_REL"
