# MCP Behavioral Evaluation — Edge-Case Handling
#
# Send malformed and boundary inputs to the MCP server's tools
# and verify that the server handles them gracefully (returns an
# error message) rather than crashing or hanging.

apiVersion: mcpchecker/v1alpha2
kind: Task
metadata:
  name: edge-case-handling
  difficulty: medium

spec:
  prompt:
    inline: |
      You are testing an MCP server's edge-case handling.

      1. List all available tools on the MCP server.
      2. Pick one tool that has multiple parameters or complex input
         types — this makes edge-case testing more meaningful.
      3. For the selected tool, attempt exactly one call per edge case below:
         a. If the tool has required arguments, call it with one required
            argument set to "" or null, or omit it entirely. If the tool
            has no required arguments, call it with an unknown field.
         b. If the tool has an argument with type constraints (e.g. integer,
            boolean, enum), call it with the WRONG TYPE for that argument
            (e.g., pass a string where a number is expected).
         c. If the tool accepts a string parameter, send an extremely long
            value (1000+ characters of repeated text, e.g. "a" * 1100).
      4. For each of the three calls above, record and report:
         - The exact tool name and the exact input you sent
         - The exact response the server returned (error message, data, or nothing)
         - Whether the server remained responsive after the call
      Do not repeat the same edge case multiple times.

  verify:
    - llmJudge:
        contains: |
          Server handles malformed input gracefully.
          Based on the agent's report:
          1. One tool was tested with multiple types of invalid input
             (empty/missing arguments, wrong types, and boundary values)
          2. The server returned error responses (not crashes or hangs) for malformed inputs
          3. The server remained responsive after receiving bad input
