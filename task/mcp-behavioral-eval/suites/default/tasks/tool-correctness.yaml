# MCP Behavioral Evaluation — Tool Correctness
#
# Run real tasks against the MCP server's tools and verify that
# the outputs are valid and conform to the declared schemas.
# This test is server-agnostic: it discovers available tools
# dynamically and invokes each with reasonable inputs.

apiVersion: mcpchecker/v1alpha2
kind: Task
metadata:
  name: tool-correctness
  difficulty: easy

spec:
  prompt:
    inline: |
      You are testing an MCP server for tool correctness.

      1. List all available tools on the MCP server.
      2. For each tool, read its input schema carefully.
      3. Invoke each tool with valid, reasonable input arguments that
         conform to its declared input schema.
      4. Report for each tool:
         - The tool name
         - The input you provided
         - Whether the call succeeded or failed
         - A summary of the response received

      Do not skip any tools. If a tool requires specific resource
      identifiers you do not have, use plausible placeholder values
      and note this in your report.

  verify:
    - llmJudge:
        contains: |
          Based on the agent's report:
          1. The server exposed a list of all its available tools
          2. Each discovered tool was invoked at least once with valid inputs
          3. Tools returned successful responses, not errors, for valid inputs
          4. Responses contained meaningful data relevant to the tool's purpose
          5. No tool call resulted in a crash, hang, or connection error
