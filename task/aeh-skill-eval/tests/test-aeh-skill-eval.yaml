apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-aeh-skill-eval
spec:
  workspaces:
    - name: tests-workspace
      description: The workspace provided by the test runner script.
  tasks:
    - name: run-aeh-skill-eval
      taskRef:
        name: aeh-skill-eval
      params:
        - name: changed-skills
          value: [test/fixture-skill]
        - name: fail-on-non-success
          value: "false"
        - name: submission-revision
          value: deadbeef
        - name: source-artifact
          value: localhost:5000/nonexistent/artifact:latest
        - name: evaluation-image
          value: $(params.evaluation-image)
        - name: tiers
          value: '1'
      workspaces:
        - name: source
          workspace: tests-workspace
    - name: verify-result
      runAfter:
        - run-aeh-skill-eval
      params:
        - name: tier-a-json
          value: $(tasks.run-aeh-skill-eval.results.TEST_OUTPUT_TIER_A)
        - name: tier-b-json
          value: $(tasks.run-aeh-skill-eval.results.TEST_OUTPUT_TIER_B)
      taskSpec:
        params:
          - name: tier-a-json
            type: string
          - name: tier-b-json
            type: string
        steps:
          - name: check-results
            image: registry.access.redhat.com/ubi9/python-311:latest
            env:
              - name: TIER_A_JSON
                value: $(params.tier-a-json)
              - name: TIER_B_JSON
                value: $(params.tier-b-json)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              echo "TEST_OUTPUT_TIER_A: ${TIER_A_JSON}"
              echo "TEST_OUTPUT_TIER_B: ${TIER_B_JSON}"
              python3 -c "
              import json, os, sys

              tier_a = json.loads(os.environ['TIER_A_JSON'])
              tier_b = json.loads(os.environ['TIER_B_JSON'])

              if tier_a.get('result') != 'ERROR':
                  print(f\"FAIL: expected TEST_OUTPUT_TIER_A result=ERROR, got {tier_a.get('result')!r}\")
                  sys.exit(1)
              if tier_b.get('result') != 'SKIPPED':
                  print(f\"FAIL: expected TEST_OUTPUT_TIER_B result=SKIPPED, got {tier_b.get('result')!r}\")
                  sys.exit(1)
              print('aeh-skill-eval correctly reported Tier A ERROR / Tier B SKIPPED for an unresolvable source-artifact')
              "
  params:
    - name: evaluation-image
      type: string
      description: CLI-compatible runtime image.
      default: quay.io/ecosystem-appeng/agent-eval-harness:v1.0.5-runner@sha256:961abe053e959ac0f4d3cf849cdd86f06a27368128ca902aaabced092932d12e
