apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aeh-skill-eval
  annotations:
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: 1.0.0
spec:
  description: >-
    Run requested tiers and optional application persistence through one abeval
    invocation. Use the existing Konflux task-runner for OCI evidence attachment
    and standard Python images for inline result conversion.
  params:
    - name: submission-dir
      type: string
      description: 'Catalog skill identifier: <pack>/<skill>.'
    - name: submission-revision
      type: string
      description: Evaluated source commit SHA.
    - name: source-artifact
      type: string
      description: Trusted source artifact for the evaluated revision.
    - name: evaluation-image
      type: string
      description: >-
        Complete CLI image with both scanners, unchanged AEH runtime, model clients,
        and storage clients.
      default: quay.io/ecosystem-appeng/agent-eval-harness:v1.0-runner@sha256:c4b1f29e5eef8adab45e7d2c9d640af31f82d2b962179f3438a17d0d7065c781
    - name: tiers
      type: string
      default: '1'
      description: 'Evaluation tiers passed directly to the CLI: 1, 2, or 1,2.'
    - name: aeh-image
      type: string
      description: Trial image pullable by the workload cluster; used for Tier 2.
      default: quay.io/ecosystem-appeng/agent-eval-harness:v1.0-trial@sha256:c497b4f57d17aa7cfba98a97a1b2d4eca330268a38270a99e39cb77ce71cb226
    - name: persist
      type: string
      description: >-
        Optional evaluation persistence: postgres,s3,compass. OCI evidence attachment
        is controlled by image-url and image-digest.
      default: ''
    - name: persistence-required
      type: string
      description: Treat selected publication failures as errors.
      default: 'true'
    - name: image-url
      type: string
      default: ''
      description: Built component image repository for OCI report attachment.
    - name: image-digest
      type: string
      default: ''
      description: Built component image digest for OCI report attachment.
    - name: llm-secret
      type: string
      description: Konflux Secret containing api-key for local review and suite-level
        judging.
      default: llm-credentials
    - name: llm-api-base
      type: string
      description: OpenAI-compatible review and judge endpoint, normally ending
        in /v1.
      default: ''
    - name: llm-model
      type: string
      description: Submission and optional skill review model.
      default: gemini-2.5-flash
    - name: agent-api-base
      type: string
      description: Agent provider endpoint; for Claude through LiteLLM use the
        gateway root.
      default: ''
    - name: skill-review
      type: string
      description: Enable advisory LLM skill review for every leg.
      default: 'false'
    - name: submission-review
      type: string
      description: auto honors submission metadata; also accepts on or off.
      default: auto
    - name: continue-on-tier1-failure
      type: string
      description: Run selected trials despite blocking static findings.
      default: 'false'
    - name: aeh-model-override
      type: string
      description: Override submission agent model.
      default: ''
    - name: aeh-judge-model-override
      type: string
      description: Override submission judge model.
      default: ''
    - name: aeh-kubeconfig-secret
      type: string
      description: Konflux Secret containing workload kubeconfig under key kubeconfig.
      default: agentic-plugins-konflux-sa-kubeconfig
    - name: workload-namespace
      type: string
      description: Namespace on the workload cluster.
      default: agentic-plugins-evaluation
    - name: workload-credentials-secret
      type: string
      description: Existing workload Secret with native provider SDK environment
        keys.
      default: llm-credentials
    - name: workload-service-account
      type: string
      description: Trial service account; empty uses native AEH defaults.
      default: ''
    - name: database-secret
      type: string
      description: Konflux Secret with database-url and optional database-tls-route-host.
      default: ab-eval-db-credentials
    - name: s3-secret
      type: string
      description: >-
        Konflux Secret with endpoint-url, root-user, root-password, optional insecure-skip-tls-verify.
      default: minio-credentials
    - name: s3-bucket
      type: string
      description: S3 publication bucket.
      default: ab-eval-reports
    - name: compass-secret
      type: string
      description: Konflux Secret containing token.
      default: compass-facts-api
    - name: ca-bundle-configmap
      type: string
      description: Optional Konflux ConfigMap with trusted CA bundle at ca-bundle.crt.
      default: trusted-ca-bundle
    - name: otel-exporter-endpoint
      type: string
      description: Optional OTLP/gRPC collector endpoint.
      default: ''
  workspaces:
    - name: source
      description: Scratch storage for isolated CLI runs; keyed by TaskRun name.
  results:
    - name: TEST_OUTPUT_TIER_A
      description: Konflux Tier 1 result, or SKIPPED when Tier 1 was not requested.
    - name: TEST_OUTPUT_TIER_B
      description: Konflux Tier 2 result, or SKIPPED when Tier 2 was not requested.
    - name: TEST_OUTPUT_PUBLICATION
      description: Konflux result for all explicitly selected publication destinations.
    - name: skill-reports-ARTIFACT_OUTPUTS
      type: object
      description: OCI report referrer, or empty uri/digest when none was attached.
      properties:
        uri: {}
        digest: {}
        skill: {}
  stepTemplate:
    env:
      - name: ABEVAL_SOURCE
        value: /var/workdir/source
      - name: ABEVAL_OUTPUT
        value: $(workspaces.source.path)/runs/$(context.taskRun.name)
      - name: ABEVAL_RUN_ID
        value: $(context.taskRun.name)
      - name: ABEVAL_REVISION
        value: $(params.submission-revision)
      - name: ABEVAL_PERSISTENCE_REQUIRED
        value: $(params.persistence-required)
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: trusted-ca
        mountPath: /var/trusted-ca
        readOnly: true
  volumes:
    - name: workdir
      emptyDir: {}
    - name: aeh-kubeconfig
      secret:
        secretName: $(params.aeh-kubeconfig-secret)
        optional: true
    - name: trusted-ca
      configMap:
        name: $(params.ca-bundle-configmap)
        optional: true
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:a61ef5dfee9a8720f7bc2d1d52001057ca6a22d2ddbae0db175b11d9ab95105a
      onError: continue
      args:
        - use
        - $(params.source-artifact)=/var/workdir/source
    - name: evaluate
      image: $(params.evaluation-image)
      onError: continue
      env:
        - name: ABEVAL_SCANNER_RUNTIME
          value: local
        - name: ABEVAL_PERSIST
          value: $(params.persist)
        - name: ABEVAL_LLM_BASE_URL
          value: $(params.llm-api-base)
        - name: ABEVAL_JUDGE_BASE_URL
          value: $(params.llm-api-base)
        - name: ABEVAL_AGENT_BASE_URL
          value: $(params.agent-api-base)
        - name: ABEVAL_LLM_MODEL
          value: $(params.llm-model)
        - name: ABEVAL_SKILL_REVIEW
          value: $(params.skill-review)
        - name: ABEVAL_SUBMISSION_REVIEW
          value: $(params.submission-review)
        - name: ABEVAL_CONTINUE_ON_TIER1_FAILURE
          value: $(params.continue-on-tier1-failure)
        - name: ABEVAL_MODEL
          value: $(params.aeh-model-override)
        - name: ABEVAL_JUDGE_MODEL
          value: $(params.aeh-judge-model-override)
        - name: ABEVAL_KUBECONFIG
          value: /var/workload/kubeconfig
        - name: ABEVAL_NAMESPACE
          value: $(params.workload-namespace)
        - name: ABEVAL_CREDENTIALS_SECRET
          value: $(params.workload-credentials-secret)
        - name: ABEVAL_TRIAL_IMAGE
          value: $(params.aeh-image)
        - name: AGENT_EVAL_K8S_SERVICE_ACCOUNT
          value: $(params.workload-service-account)
        - name: ABEVAL_S3_BUCKET
          value: $(params.s3-bucket)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: $(params.otel-exporter-endpoint)
        - name: ABEVAL_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.llm-secret)
              key: api-key
              optional: true
        - name: ABEVAL_AGENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.llm-secret)
              key: api-key
              optional: true
        - name: ABEVAL_JUDGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.llm-secret)
              key: api-key
              optional: true
        - name: ABEVAL_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: $(params.database-secret)
              key: database-url
              optional: true
        - name: ABEVAL_DATABASE_TLS_ROUTE_HOST
          valueFrom:
            secretKeyRef:
              name: $(params.database-secret)
              key: database-tls-route-host
              optional: true
        - name: ABEVAL_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: endpoint-url
              optional: true
        - name: ABEVAL_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: root-user
              optional: true
        - name: ABEVAL_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: root-password
              optional: true
        - name: MINIO_INSECURE_SSL
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: insecure-skip-tls-verify
              optional: true
        - name: ABEVAL_COMPASS_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.compass-secret)
              key: token
              optional: true
        - name: SKILL_ID
          value: $(params.submission-dir)
        - name: EVALUATION_TIERS
          value: $(params.tiers)
      volumeMounts:
        - name: aeh-kubeconfig
          mountPath: /var/workload
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -s /var/trusted-ca/ca-bundle.crt ]; then
          export SSL_CERT_FILE=/var/trusted-ca/ca-bundle.crt
        fi
        if [ "$(cat "$(steps.step-use-trusted-artifact.exitCode.path)")" != 0 ]; then
          echo "Trusted source retrieval failed" >&2
          exit 3
        fi
        abeval run --skill-id "$SKILL_ID" --source "$ABEVAL_SOURCE" \
          --tiers "$EVALUATION_TIERS" --persist "$ABEVAL_PERSIST" \
          --output "$ABEVAL_OUTPUT"
    - name: package-oci-reports
      image: registry.access.redhat.com/ubi9/python-311:latest
      onError: continue
      env: &id001
        - &id002
          name: IMAGE_URL
          value: $(params.image-url)
        - &id003
          name: IMAGE_DIGEST
          value: $(params.image-digest)
        - &id004
          name: SUBMISSION_DIR
          value: $(params.submission-dir)
      script: |
        #!/usr/bin/env python3
        import os
        import tarfile
        from pathlib import Path

        if os.environ["IMAGE_URL"] and os.environ["IMAGE_DIGEST"]:
            run = Path(os.environ["ABEVAL_OUTPUT"])
            if not (run / "run.json").is_file() or not (run / "reports").is_dir():
                raise SystemExit("No evaluation evidence available for attachment")
            with tarfile.open(run / "reports.tar.gz", "w:gz") as archive:
                archive.add(run / "reports", arcname="reports")
                archive.add(run / "run.json", arcname="run.json")
    - name: attach-oci-reports
      image: quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81
      onError: continue
      env: *id001
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -z "$IMAGE_URL" ] || [ -z "$IMAGE_DIGEST" ]; then
          exit 0
        fi
        ARCHIVE="${ABEVAL_OUTPUT}/reports.tar.gz"
        if [ ! -s "$ARCHIVE" ]; then
          echo "No report archive available for attachment" >&2
          exit 1
        fi
        select-oci-auth "$IMAGE_URL" > "$HOME/auth.json"
        cd "$ABEVAL_OUTPUT"
        ATTACH_OUTPUT=$(retry oras attach --no-tty --registry-config "$HOME/auth.json" \
          --artifact-type application/vnd.agentic-eval.reports.v1 \
          "${IMAGE_URL}@${IMAGE_DIGEST}" \
          "reports.tar.gz:application/gzip" 2>&1) || { echo "$ATTACH_OUTPUT"; exit 1; }
        echo "$ATTACH_OUTPUT"
        ATTACH_DIGEST=$(printf '%s\n' "$ATTACH_OUTPUT" | sed -n 's/^Digest: //p' | tail -n 1)
        if [[ ! "$ATTACH_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "ORAS did not report a valid artifact digest" >&2
          exit 1
        fi
        printf '{"uri":"%s","digest":"%s","skill":"%s"}' \
          "$IMAGE_URL" "$ATTACH_DIGEST" "$SUBMISSION_DIR" \
          > "$(results.skill-reports-ARTIFACT_OUTPUTS.path)"
    - name: emit-results
      image: registry.access.redhat.com/ubi9/python-311:latest
      env:
        - *id002
        - *id003
        - *id004
        - name: EVALUATION_TIERS
          value: $(params.tiers)
        - name: EVALUATION_PERSIST
          value: $(params.persist)
        - name: ATTACH_EXIT_PATH
          value: $(steps.step-attach-oci-reports.exitCode.path)
        - name: TIER1_PATH
          value: $(results.TEST_OUTPUT_TIER_A.path)
        - name: TIER2_PATH
          value: $(results.TEST_OUTPUT_TIER_B.path)
        - name: PUBLICATION_PATH
          value: $(results.TEST_OUTPUT_PUBLICATION.path)
        - name: ARTIFACT_PATH
          value: $(results.skill-reports-ARTIFACT_OUTPUTS.path)
      script: |
        #!/usr/bin/env python3
        import json
        import os
        import re
        from datetime import datetime, timezone
        from pathlib import Path

        stamp = datetime.now(timezone.utc).isoformat()
        skill = os.environ["SUBMISSION_DIR"]

        def output(state, note, successes=0, failures=0, warnings=0):
            return dict(result=state, timestamp=stamp, note=note,
                        successes=successes, failures=failures, warnings=warnings)

        def project(steps, required, label):
            by_name = {step["name"]: step for step in steps}
            missing = required - by_name.keys()
            selected = [by_name[name] for name in required if name in by_name]
            invalid = [s["name"] for s in selected if s.get("status") not in {"completed", "error", "skipped"}
                       or s.get("verdict") not in {"pass", "warn", "fail", "unavailable"}]
            errors = [s["name"] for s in selected if s.get("blocking", True)
                      and (s.get("status") in {"error", "skipped"} or s.get("verdict") == "unavailable")]
            failed = [s["name"] for s in selected if s.get("blocking", True) and s.get("verdict") == "fail"]
            problems = sorted(set(missing) | set(invalid + errors + failed))
            state = "ERROR" if missing or invalid or errors else "FAILURE" if failed else "SUCCESS"
            warnings = sum(s.get("verdict") == "warn" or
                           (not s.get("blocking", True) and
                       (s.get("status") != "completed" or s.get("verdict") == "fail")) for s in selected)
            return output(state, label + (": " + ", ".join(problems) if problems else ": completed"),
                          sum(s.get("status") == "completed" and s.get("verdict") in {"pass", "warn"} for s in selected),
                          len(problems), warnings)

        try:
            tiers = {int(value) for value in os.environ["EVALUATION_TIERS"].split(",")}
            if not tiers or tiers - {1, 2}:
                raise ValueError("Invalid tiers")
        except ValueError:
            tiers = {1, 2}

        tier1 = output("SKIPPED", skill + ": Tier 1 not requested")
        tier2 = output("SKIPPED", skill + ": Tier 2 not requested")
        try:
            run = json.loads((Path(os.environ["ABEVAL_OUTPUT"]) / "run.json").read_text())
            if run["schema_version"] != "1.0":
                raise ValueError("Unsupported evidence schema")
            steps = run["steps"]
            if 1 in tiers:
                required = {"prepare", "structure", "security", "quality", "report"}
                if "skill-review" in run["requested_steps"]:
                    required.add("skill-review")
                tier1 = project(steps, required, skill + " Tier 1")
            if 2 in tiers:
                required = {"prepare", "submission", "evaluate", "report"}
                if "submission-review" in run["requested_steps"]:
                    required.add("submission-review")
                tier2 = project(steps, required, skill + " Tier 2")
            destinations = {v.strip() for v in os.environ["EVALUATION_PERSIST"].split(",") if v.strip()}
            publication = project(run["publication"], destinations, skill + " publication")
        except (OSError, ValueError, KeyError, TypeError, AttributeError):
            error = output("ERROR", skill + ": missing or invalid evaluation evidence", failures=1)
            if 1 in tiers:
                tier1 = error
            if 2 in tiers:
                tier2 = error
            publication = error.copy()

        artifact_path = Path(os.environ["ARTIFACT_PATH"])
        artifact = dict(uri="", digest="", skill=skill)
        attachment_requested = bool(os.environ["IMAGE_URL"] or os.environ["IMAGE_DIGEST"])
        if attachment_requested:
            try:
                artifact = json.loads(artifact_path.read_text())
                if (artifact["uri"] != os.environ["IMAGE_URL"] or artifact["skill"] != skill
                        or not re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])
                        or Path(os.environ["ATTACH_EXIT_PATH"]).read_text().strip() != "0"):
                    raise ValueError("Invalid OCI attachment result")
                publication["successes"] += 1
            except (OSError, ValueError, KeyError, TypeError):
                artifact = dict(uri="", digest="", skill=skill)
                publication["result"] = "ERROR"
                publication["failures"] += 1
                publication["note"] += "; OCI evidence attachment failed"

        for name, payload in [("TIER1_PATH", tier1), ("TIER2_PATH", tier2),
                              ("PUBLICATION_PATH", publication), ("ARTIFACT_PATH", artifact)]:
            Path(os.environ[name]).write_text(json.dumps(payload))
