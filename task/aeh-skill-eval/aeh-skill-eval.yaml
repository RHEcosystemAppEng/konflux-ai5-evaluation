apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aeh-skill-eval
  annotations:
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: 2.0.1
spec:
  description: >-
    Evaluate changed skills sequentially through one abeval batch invocation.
    Preserve per-skill evidence and persistence; attach batch OCI evidence and
    emit bounded aggregate results before enforcing static/publication gates.
  params:
    - name: changed-skills
      type: array
      default: []
      description: 'Ordered catalog skill identifiers; an empty list is a successful no-op.'
    - name: submission-revision
      type: string
      description: Evaluated source commit SHA.
    - name: source-artifact
      type: string
      description: Trusted source artifact for the evaluated revision.
    - name: evaluation-image
      type: string
      description: >-
        Complete CLI image with both scanners, unchanged AEH runtime, model clients,
        and storage clients.
      default: quay.io/ecosystem-appeng/agent-eval-harness:v1.0.2-runner@sha256:cd70287e9cb68ab36b0f150635ed07c89cc2fbbdc910118d2efb27e52c95f77d
    - name: tiers
      type: string
      default: '1'
      description: 'Evaluation tiers passed directly to the CLI: 1, 2, or 1,2.'
    - name: aeh-image
      type: string
      description: Trial image pullable by the workload cluster; used for Tier 2.
      default: quay.io/ecosystem-appeng/agent-eval-harness:v1.0.2-trial@sha256:374b28704de8562ae2d6130d84d8d33d99db7dfe9680315034b10db5308cc983
    - name: persist
      type: string
      description: >-
        Optional evaluation persistence: postgres,s3,compass. OCI evidence attachment
        is controlled by image-url and image-digest.
      default: ''
    - name: persistence-required
      type: string
      description: Treat selected publication failures as errors.
      default: 'true'
    - name: image-url
      type: string
      default: ''
      description: Built component image repository for OCI report attachment.
    - name: image-digest
      type: string
      default: ''
      description: Built component image digest for OCI report attachment.
    - name: llm-secret
      type: string
      description: Konflux Secret containing api-key for local review and suite-level
        judging.
      default: llm-credentials
    - name: llm-api-base
      type: string
      description: OpenAI-compatible review and judge endpoint, normally ending
        in /v1.
      default: ''
    - name: llm-model
      type: string
      description: Submission and optional skill review model.
      default: gemini-2.5-flash
    - name: agent-api-base
      type: string
      description: Agent provider endpoint; for Claude through LiteLLM use the
        gateway root.
      default: ''
    - name: skill-review
      type: string
      description: Enable advisory LLM skill review for every leg.
      default: 'false'
    - name: insecure-ssl
      type: string
      description: Skip certificate verification for evaluation clients and the database TLS route; Kubernetes API verification is unchanged.
      default: 'false'
    - name: submission-review
      type: string
      description: auto honors submission metadata; also accepts on or off.
      default: auto
    - name: continue-on-tier1-failure
      type: string
      description: Run selected trials despite blocking static findings.
      default: 'false'
    - name: aeh-model-override
      type: string
      description: Override submission agent model.
      default: ''
    - name: aeh-judge-model-override
      type: string
      description: Override submission judge model.
      default: ''
    - name: aeh-kubeconfig-secret
      type: string
      description: Konflux Secret containing workload kubeconfig under key kubeconfig.
      default: agentic-plugins-konflux-sa-kubeconfig
    - name: workload-namespace
      type: string
      description: Namespace on the workload cluster.
      default: agentic-plugins-evaluation
    - name: workload-credentials-secret
      type: string
      description: Existing workload Secret with native provider SDK environment
        keys.
      default: llm-credentials
    - name: workload-service-account
      type: string
      description: Trial service account; empty uses native AEH defaults.
      default: ''
    - name: database-secret
      type: string
      description: Konflux Secret with database-url and optional database-tls-route-host.
      default: ab-eval-db-credentials
    - name: s3-secret
      type: string
      description: >-
        Konflux Secret with endpoint-url, root-user, root-password, optional insecure-skip-tls-verify.
      default: minio-credentials
    - name: s3-bucket
      type: string
      description: S3 publication bucket.
      default: ab-eval-reports
    - name: compass-secret
      type: string
      description: Konflux Secret containing token.
      default: compass-facts-api
    - name: ca-bundle-configmap
      type: string
      description: Optional Konflux ConfigMap with trusted CA bundle at ca-bundle.crt.
      default: trusted-ca-bundle
    - name: otel-exporter-endpoint
      type: string
      description: Optional OTLP/gRPC collector endpoint.
      default: ''
    - name: command-timeout
      type: string
      default: '7200'
      description: Timeout in seconds for each external AEH command.
    - name: timeout-retries
      type: string
      default: '1'
      description: Additional attempts for a timed-out AEH arm; 0-5, never retry verdict failures.
    - name: fail-on-non-success
      type: string
      default: 'true'
      description: Fail after emission when static or required-publication gates fail.
  workspaces:
    - name: source
      description: Scratch storage for isolated CLI runs; keyed by TaskRun name.
  results:
    - name: TEST_OUTPUT_TIER_A
      description: Konflux Tier 1 result, or SKIPPED when Tier 1 was not requested.
    - name: TEST_OUTPUT_TIER_B
      description: Konflux Tier 2 result, or SKIPPED when Tier 2 was not requested.
    - name: TEST_OUTPUT_PUBLICATION
      description: Konflux result for all explicitly selected publication destinations.
    - name: batch-manifest
      description: Workspace-relative validated summary path for registration.
    - name: skill-reports-ARTIFACT_OUTPUTS
      type: object
      description: Batch OCI report referrer, or empty uri/digest when none was attached.
      properties:
        uri: {}
        digest: {}
  stepTemplate:
    env:
      - name: IMAGE_URL
        value: $(params.image-url)
      - name: IMAGE_DIGEST
        value: $(params.image-digest)
      - name: EVALUATION_TIERS
        value: $(params.tiers)
      - name: ABEVAL_PERSIST
        value: $(params.persist)
      - name: ABEVAL_SOURCE
        value: /var/workdir/source
      - name: ABEVAL_OUTPUT
        value: $(workspaces.source.path)/runs/$(context.taskRun.name)
      - name: ABEVAL_RUN_ID
        value: $(context.taskRun.name)
      - name: ABEVAL_REVISION
        value: $(params.submission-revision)
      - name: ABEVAL_PERSISTENCE_REQUIRED
        value: $(params.persistence-required)
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: trusted-ca
        mountPath: /var/trusted-ca
        readOnly: true
  volumes:
    - name: workdir
      emptyDir: {}
    - name: aeh-kubeconfig
      secret:
        secretName: $(params.aeh-kubeconfig-secret)
        optional: true
    - name: trusted-ca
      configMap:
        name: $(params.ca-bundle-configmap)
        optional: true
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:a61ef5dfee9a8720f7bc2d1d52001057ca6a22d2ddbae0db175b11d9ab95105a
      onError: continue
      args:
        - use
        - $(params.source-artifact)=/var/workdir/source
    - name: evaluate
      image: $(params.evaluation-image)
      onError: continue
      env:
        - name: ABEVAL_SCANNER_RUNTIME
          value: local
        - name: ABEVAL_LLM_BASE_URL
          value: $(params.llm-api-base)
        - name: ABEVAL_JUDGE_BASE_URL
          value: $(params.llm-api-base)
        - name: ABEVAL_AGENT_BASE_URL
          value: $(params.agent-api-base)
        - name: ABEVAL_INSECURE_SSL
          value: $(params.insecure-ssl)
        - name: ABEVAL_LLM_MODEL
          value: $(params.llm-model)
        - name: ABEVAL_SKILL_REVIEW
          value: $(params.skill-review)
        - name: ABEVAL_SUBMISSION_REVIEW
          value: $(params.submission-review)
        - name: ABEVAL_CONTINUE_ON_TIER1_FAILURE
          value: $(params.continue-on-tier1-failure)
        - name: ABEVAL_MODEL
          value: $(params.aeh-model-override)
        - name: ABEVAL_JUDGE_MODEL
          value: $(params.aeh-judge-model-override)
        - name: ABEVAL_KUBECONFIG
          value: /var/workload/kubeconfig
        - name: ABEVAL_NAMESPACE
          value: $(params.workload-namespace)
        - name: ABEVAL_CREDENTIALS_SECRET
          value: $(params.workload-credentials-secret)
        - name: ABEVAL_TRIAL_IMAGE
          value: $(params.aeh-image)
        - name: AGENT_EVAL_K8S_SERVICE_ACCOUNT
          value: $(params.workload-service-account)
        - name: ABEVAL_S3_BUCKET
          value: $(params.s3-bucket)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: $(params.otel-exporter-endpoint)
        - name: ABEVAL_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.llm-secret)
              key: api-key
              optional: true
        - name: ABEVAL_AGENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.llm-secret)
              key: api-key
              optional: true
        - name: ABEVAL_JUDGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.llm-secret)
              key: api-key
              optional: true
        - name: ABEVAL_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: $(params.database-secret)
              key: database-url
              optional: true
        - name: ABEVAL_DATABASE_TLS_ROUTE_HOST
          valueFrom:
            secretKeyRef:
              name: $(params.database-secret)
              key: database-tls-route-host
              optional: true
        - name: ABEVAL_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: endpoint-url
              optional: true
        - name: ABEVAL_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: root-user
              optional: true
        - name: ABEVAL_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: root-password
              optional: true
        - name: MINIO_INSECURE_SSL
          valueFrom:
            secretKeyRef:
              name: $(params.s3-secret)
              key: insecure-skip-tls-verify
              optional: true
        - name: ABEVAL_COMPASS_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.compass-secret)
              key: token
              optional: true
        - name: ABEVAL_COMMAND_TIMEOUT
          value: $(params.command-timeout)
        - name: ABEVAL_TIMEOUT_RETRIES
          value: $(params.timeout-retries)
      volumeMounts:
        - name: aeh-kubeconfig
          mountPath: /var/workload
          readOnly: true
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          if [ -s /var/trusted-ca/ca-bundle.crt ]; then
            export SSL_CERT_FILE=/var/trusted-ca/ca-bundle.crt
          fi
          if [ "$#" -gt 0 ] && [ "$(cat "$(steps.step-use-trusted-artifact.exitCode.path)")" != 0 ]; then
            echo "Trusted source retrieval failed" >&2
            exit 3
          fi
          exec abeval batch --source "$ABEVAL_SOURCE" --tiers "$EVALUATION_TIERS" \
            --persist "$ABEVAL_PERSIST" --output "$ABEVAL_OUTPUT" --skill-ids "$@"
        - bash
        - $(params.changed-skills[*])
    - name: package-oci-reports
      image: $(params.evaluation-image)
      onError: continue
      command: [abeval, batch-package]
      args: [--batch-dir, $(workspaces.source.path)/runs/$(context.taskRun.name)]
    - name: attach-oci-reports
      image: quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81
      onError: continue
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -z "$IMAGE_URL" ] && [ -z "$IMAGE_DIGEST" ]; then
          exit 0
        fi
        test -n "$IMAGE_URL" && test -n "$IMAGE_DIGEST"
        rm -f "${ABEVAL_OUTPUT}/oci-attachment.json"
        test -s "${ABEVAL_OUTPUT}/reports.tar.gz"
        select-oci-auth "$IMAGE_URL" > "$HOME/auth.json"
        cd "$ABEVAL_OUTPUT"
        ATTACH_OUTPUT=$(retry oras attach --no-tty --registry-config "$HOME/auth.json" \
          --artifact-type application/vnd.agentic-eval.batch-reports.v1 \
          "${IMAGE_URL}@${IMAGE_DIGEST}" \
          "reports.tar.gz:application/gzip" 2>&1) || { echo "$ATTACH_OUTPUT"; exit 1; }
        echo "$ATTACH_OUTPUT"
        ATTACH_DIGEST=$(printf '%s\n' "$ATTACH_OUTPUT" | sed -n 's/^Digest: //p' | tail -n 1)
        [[ "$ATTACH_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        printf '{"uri":"%s","digest":"%s"}' "$IMAGE_URL" "$ATTACH_DIGEST" > oci-attachment.json
    - name: emit-results
      image: $(params.evaluation-image)
      env:
        - name: FAIL_ON_NON_SUCCESS
          value: $(params.fail-on-non-success)
        - name: BATCH_MANIFEST_PATH
          value: $(results.batch-manifest.path)
        - name: BATCH_MANIFEST
          value: runs/$(context.taskRun.name)/summary.json
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          printf '%s' "$BATCH_MANIFEST" > "$BATCH_MANIFEST_PATH"
          exec abeval batch-results --batch-dir "$ABEVAL_OUTPUT" \
            --revision "$ABEVAL_REVISION" --tiers "$EVALUATION_TIERS" \
            --persist "$ABEVAL_PERSIST" --results-dir /tekton/results \
            --fail-on-non-success "$FAIL_ON_NON_SUCCESS" \
            --image-url "$IMAGE_URL" --image-digest "$IMAGE_DIGEST" \
            --artifact-file "${ABEVAL_OUTPUT}/oci-attachment.json" --skill-ids "$@"
        - bash
        - $(params.changed-skills[*])
