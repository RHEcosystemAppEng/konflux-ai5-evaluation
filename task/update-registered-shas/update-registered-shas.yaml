apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-registered-shas
  annotations:
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: "1.0.0"
spec:
  description: >-
    Register only evaluated skill IDs from a revision-bound batch manifest after
    static/publication gates pass. Runtime errors remain at their previous SHA.
    Commit once with [skip-evaluation] to prevent recursive evaluation.
  params:
    - name: current-sha
      type: string
      description: Commit SHA under evaluation.
    - name: should-evaluate
      type: string
      description: When not "true", this Task is a no-op (skips registration and push entirely).
    - name: changed-skills
      type: array
      default: []
      description: Expected unique skill identifiers; validated against the batch summary.
    - name: batch-manifest
      type: string
      description: Path relative to the source workspace containing the validated batch summary.
    - name: register-script-path
      type: string
      default: "scripts/register_evaluation_results.py"
      description: >-
        Path, relative to the repository root, of the registration script to
        run. Must accept --current-sha/--changed-skills/--batch-manifest and
        rewrite its tracked bookkeeping files in place.
    - name: git-remote-url
      type: string
      default: "https://gitlab.cee.redhat.com/ai5-marketplace/agentic-plugins.git"
      description: HTTPS URL to push the registration commit to.
    - name: git-push-branch
      type: string
      default: "main"
      description: Branch to push the registration commit to.
    - name: git-ssl-no-verify
      type: string
      default: "true"
      description: >-
        When "true", disables TLS certificate verification for the git push
        (needed for internal GitLab instances with a private CA). Set to
        "false" for publicly-trusted GitLab instances.
    - name: git-bot-name
      type: string
      default: "agentic-plugins-bot"
      description: git user.name for the registration commit.
    - name: git-bot-email
      type: string
      default: "agentic-plugins-bot@redhat.com"
      description: git user.email for the registration commit.
    - name: git-token-secret-name
      type: string
      default: "agentic-plugins-gitlab-sa"
      description: Name of the Secret containing a GitLab access token with push access to the repository.
    - name: git-token-secret-key
      type: string
      default: "password"
      description: Key within git-token-secret-name holding the GitLab access token.
  workspaces:
    - name: source
      description: >-
        Must already contain an authenticated, checked-out clone at
        ./repo (e.g. produced by the discover-changed-skills Task sharing
        this same workspace).
  steps:
    - name: register-and-push
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: CURRENT_SHA
          value: $(params.current-sha)
        - name: SHOULD_EVALUATE
          value: $(params.should-evaluate)
        - name: REGISTER_SCRIPT_PATH
          value: $(params.register-script-path)
        - name: GIT_REMOTE_URL
          value: $(params.git-remote-url)
        - name: GIT_PUSH_BRANCH
          value: $(params.git-push-branch)
        - name: GIT_SSL_NO_VERIFY_PARAM
          value: $(params.git-ssl-no-verify)
        - name: GIT_BOT_NAME
          value: $(params.git-bot-name)
        - name: GIT_BOT_EMAIL
          value: $(params.git-bot-email)
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.git-token-secret-name)
              key: $(params.git-token-secret-key)
      command: ["bash", "-c"]
      args:
        - |
          set -euo pipefail

          if [ "$SHOULD_EVALUATE" != "true" ]; then
            echo "Skipping SHA registration: evaluation was skipped this run (should-evaluate=$SHOULD_EVALUATE)"
            exit 0
          fi

          pip install --quiet --no-cache-dir pyyaml
          if [ "$GIT_SSL_NO_VERIFY_PARAM" = "true" ]; then
            export GIT_SSL_NO_VERIFY=true
          fi

          python3 "$REGISTER_SCRIPT_PATH" "$@"

          if git diff --quiet -- .; then
            echo "No registered-SHA changes to commit."
            exit 0
          fi

          git config user.name "$GIT_BOT_NAME"
          git config user.email "$GIT_BOT_EMAIL"
          git config credential.helper store
          GIT_HOST=$(printf '%s' "$GIT_REMOTE_URL" | sed -E 's#^https://([^/]+)/.*#\1#')
          echo "https://oauth2:${GIT_TOKEN}@${GIT_HOST}" > ~/.git-credentials

          git add -A
          git commit --quiet -m "chore(evaluation): register skill SHAs at ${CURRENT_SHA} [skip-evaluation]"
          git push --quiet "$GIT_REMOTE_URL" "HEAD:${GIT_PUSH_BRANCH}"
        - "bash"
        - "--current-sha"
        - "$(params.current-sha)"
        - "--changed-skills"
        - "$(params.changed-skills[*])"
        - "--batch-manifest"
        - "$(workspaces.source.path)/$(params.batch-manifest)"
