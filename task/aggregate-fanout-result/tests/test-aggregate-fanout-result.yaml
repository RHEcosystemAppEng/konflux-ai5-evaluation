apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-aggregate-fanout-result
spec:
  workspaces:
    - name: tests-workspace
      description: Provided by the test runner; unused.
  tasks:
    - name: aggregate
      taskRef:
        name: aggregate-fanout-result
      params:
        - name: changed-skills
          value:
            - demo
        - name: eval-outcomes
          value:
            - '{"result":"SKIPPED"}'
        - name: fail-on-non-success
          value: 'true'
    - name: verify
      params:
        - name: outcome
          value: $(tasks.aggregate.results.TEST_OUTPUT)
      taskSpec:
        params:
          - name: outcome
            type: string
        steps:
          - name: check
            image: registry.access.redhat.com/ubi9/python-311:latest
            env:
              - name: OUTCOME
                value: $(params.outcome)
            script: |
              #!/usr/bin/env python3
              import json, os
              result = json.loads(os.environ["OUTCOME"])
              assert result["result"] == "SUCCESS"
              assert result["successes"] == 0
