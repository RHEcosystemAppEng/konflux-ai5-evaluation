apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aggregate-fanout-result
  annotations:
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: 1.0.0
spec:
  description: >-
    Aggregate aligned Matrix TEST_OUTPUT JSON inline using Python. SKIPPED legs
    are excluded; malformed, duplicate, or mismatched inputs produce ERROR.
  params:
    - name: changed-skills
      type: array
      description: Skill identifiers aligned with eval-outcomes.
      default: []
    - name: eval-outcomes
      type: array
      description: Per-skill TEST_OUTPUT JSON values.
      default: []
    - name: fail-on-non-success
      type: string
      description: Fail the task after writing a non-success result.
      default: 'false'
  results:
    - name: TEST_OUTPUT
      description: Aggregated Konflux result.
  steps:
    - name: aggregate
      image: registry.access.redhat.com/ubi9/python-311:latest
      command:
        - python3
        - -c
      args:
        - |
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          gate, target = sys.argv[1:3]
          values = sys.argv[3:]
          try:
              if gate not in {"true", "false"} or values.count("--skills") != 1 or values.count("--outcomes") != 1:
                  raise ValueError("Invalid arguments")
              boundary = values.index("--outcomes")
              if values[0] != "--skills":
                  raise ValueError("Missing skills array")
              skills, raw = values[1:boundary], values[boundary+1:]
              if len(skills) != len(raw) or len(set(skills)) != len(skills):
                  raise ValueError("Skill and outcome arrays must be unique and aligned")
              states = [json.loads(item)["result"] for item in raw]
              if any(state not in {"SUCCESS", "FAILURE", "ERROR", "WARNING", "SKIPPED"} for state in states):
                  raise ValueError("Unknown outcome")
              evaluated = [(skill, state) for skill, state in zip(skills, states) if state != "SKIPPED"]
              failed = [skill for skill, state in evaluated if state != "SUCCESS"]
              state = "FAILURE" if failed else "SUCCESS"
              note = f"Evaluated {len(evaluated)} skill(s); {len(failed)} failed."
              if failed:
                  note += " Failed: " + ", ".join(failed[:10])
              successes, failures = len(evaluated) - len(failed), len(failed)
          except (ValueError, KeyError, TypeError, IndexError):
              state, note, successes, failures = "ERROR", "Invalid or mismatched Matrix results", 0, 1
          result = dict(result=state, timestamp=datetime.now(timezone.utc).isoformat(),
                        note=note, successes=successes, failures=failures, warnings=0)
          Path(target).write_text(json.dumps(result))
          print(json.dumps(result))
          sys.exit(2 if gate not in {"true", "false"} else int(gate == "true" and state != "SUCCESS"))
        - $(params.fail-on-non-success)
        - $(results.TEST_OUTPUT.path)
        - --skills
        - $(params.changed-skills[*])
        - --outcomes
        - $(params.eval-outcomes[*])
