# Trusted Artifacts (TA) exemptions.
#
# The `missing-ta-tasks` check (see SHARED-CI.md) requires every Task that
# declares a non-ignored workspace to have a `${task_name}-oci-ta` sibling
# variant. The three Tasks below are deliberately exempt: their `source`
# workspace is not used to pass build artifacts between sequential pipeline
# Tasks (the use case Trusted Artifacts/ADR36 targets) -- it is either a
# Matrix-shared scratch directory or a mutable git checkout that gets
# pushed back to, neither of which maps onto the OCI-Trusted-Artifact
# model without changing the Task's actual behavior.
#
# - task/aeh-skill-eval/aeh-skill-eval.yaml: `source` is a scratch PVC
#   shared by every concurrent Matrix leg (one leg per catalog item, see
#   the Task's own CONCURRENCY note); each leg computes its own
#   `legs/<slug>` subdirectory under it. The Task already consumes its
#   caller's actual trusted Source Artifact via the `source-artifact` param
#   + `use-trusted-artifact` step -- the workspace itself carries no data
#   between pipeline Tasks.
#
# MCP evaluation tasks:
#   The Tasks below form the MCP server evaluation pipeline. Their
#   workspaces serve two purposes that do not map onto the OCI-Trusted-
#   Artifact model:
#   - `target-kubeconfig`: a read-only credential mount (OCP Secret) for
#     reaching a remote target cluster -- not a build artifact.
#   - `source`: an inter-step scratch area for evaluation results, reports,
#     and generated Job manifests written during the pipeline run. No
#     source-code build artifact is passed between pipeline Tasks through
#     this workspace.
#
#   Note: `deploy-mcp` and `mcp-static-eval` are NOT listed here because
#   they consume actual MCP server source code from the pipeline's
#   git-clone task. Both have proper `-oci-ta` variants generated from
#   their recipe.yaml files.
#
# - task/mcp-static-eval-oci-ta/mcp-static-eval-oci-ta.yaml: the OCI-TA
#   variant of mcp-static-eval still declares a `reports` workspace for
#   writing evaluation output consumed by downstream tasks (e.g.
#   generate-compass-facts). This workspace carries generated reports, not
#   source-code build artifacts, so a second OCI-TA nesting is not needed.
paths:
  - task/aeh-skill-eval/aeh-skill-eval.yaml
  - task/create-namespace/create-namespace.yaml
  - task/generate-compass-facts/generate-compass-facts.yaml
  - task/mcp-behavioral-eval/mcp-behavioral-eval.yaml
  - task/mcp-conformance-eval/mcp-conformance-eval.yaml
  - task/parse-snapshot/parse-snapshot.yaml
  - task/publish-to-compass/publish-to-compass.yaml
  - task/publish-to-db/publish-to-db.yaml
  - task/teardown-namespace/teardown-namespace.yaml
  - task/mcp-static-eval-oci-ta/mcp-static-eval-oci-ta.yaml
  - task/wait-ready/wait-ready.yaml

workspaces:
  - target-kubeconfig
